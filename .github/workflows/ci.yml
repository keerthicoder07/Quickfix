name: Quickfix CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: develop-quickfix-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    name: Server

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        command: >
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip downloads
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Bench
        run: pip install frappe-bench

      - name: Initialize Bench
        run: bench init frappe-bench --frappe-branch version-15 --skip-assets

      - name: Create Site
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost \
          --mariadb-root-password root \
          --admin-password admin \
          --db-name test_quickfix

      - name: Checkout Quickfix App into Bench
        uses: actions/checkout@v4
        with:
          path: frappe-bench/apps/quickfix

      - name: Install Quickfix App
        working-directory: frappe-bench
        run: bench --site test.localhost install-app quickfix

      - name: Run Tests
        working-directory: frappe-bench
        continue-on-error: false
        run: bench --site test.localhost run-tests --app quickfix --verbose